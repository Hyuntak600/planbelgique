 ['salary',["제시받은 연봉 (AUD, 연)","Salaire annuel proposé (AUD)"],'number',["기본 연봉","Salaire de base"]],
 ['amsr',["같은 직업 시장 임금 AMSR (AUD)","Salaire du marché AMSR pour ce métier (AUD)"],'number',["모르면 비워 두세요","Laissez vide si inconnu"]],
 ['exp',["해당 직업 경력 (년, 풀타임 환산)","Expérience dans ce métier (années, équivalent temps plein)"],'number',["최근 5년 안 경력","Expérience des 5 dernières années"]],
 ['eng',["영어: 각 영역 중 가장 낮은 IELTS","Anglais : le score IELTS le plus bas parmi les épreuves"],'number',["예: 5, 6.5","Ex. : 5 ; 6,5"]],
 ['engEx',["영어 면제 대상 국가 여권인가요?","Passeport d'un pays dispensé du test d'anglais ?"],'yn',["면제국이면 시험 불필요","Si dispensé, aucun test requis"]],
 ['onVisa',["현 고용주 밑 482 근무 (년)","Années en visa 482 chez l'employeur actuel"],'number',""],

 ['docs',["영문 번역 서류를 준비했나요?","Documents traduits en anglais prêts ?"],'yn',""]
];

const WK=[["Day 1: PTE 시험 날짜 예약 (2~3주 뒤)","Jour 1 : réserver la date du PTE (dans 2-3 semaines)"],["Day 2: APEUni 설치 + 무료 모의고사 1회","Jour 2 : installer APEUni + 1 test blanc gratuit"],["Day 3~5: Describe Image 템플릿을 안 보고 25초 말하기","Jours 3-5 : Describe Image, 25 s sans regarder le modèle"],["Day 6~10: Write From Dictation 빈출 문장 50개 암기·타이핑","Jours 6-10 : 50 phrases fréquentes de Write From Dictation (mémoriser + taper)"],["Day 11~14: 시간 맞춰 모의고사 1회 완주 후 시험 응시","Jours 11-14 : 1 test blanc chronométré complet, puis passer le test"]];
const D1=[
{t:["먼저 전체 흐름부터","Le déroulé en un coup d'œil"],d:["처음이라면 이 순서만 기억하세요. 아래 카드들은 각 단계를 하나씩 풀어서 설명해요.","Si c'est votre première fois, retenez cet ordre. Les cartes suivantes détaillent chaque étape."],steps:[["1",["회사가 스폰서(SBS) 승인을 받아요.","L'entreprise obtient l'agrément sponsor (SBS)."]],["2",["회사가 구인 광고(LMT)를 4주 동안 올려요.","L'entreprise publie l'annonce (LMT) pendant 4 semaines."]],["3",["회사가 내 자리를 정부에 요청해요(노미네이션).","L'entreprise dépose la nomination de mon poste."]],["4",["나는 영어 시험과 서류를 준비해요.","Je prépare le test d'anglais et les documents."]],["5",["내가 482 비자를 신청하고, 승인을 기다려요.","Je dépose le visa 482 et j'attends la décision."]]]},
{t:["482 비자란?","Qu'est-ce que le visa 482 ?"],d:["쉽게 말하면 ‘호주 회사가 나를 직원으로 쓰겠다고 정부에 보증해 줘서 받는 일하는 비자’예요. 원칙적으로 나를 스폰서해 준 회사에서 일해야 하고, 최대 4년까지 받을 수 있어요.", "En clair : un visa de travail que vous obtenez parce qu'une entreprise australienne se porte garante de vous auprès du gouvernement. En principe, vous travaillez pour l'entreprise qui vous sponsorise, jusqu'à 4 ans."]},
{t:["영주권으로 가는 길","Vers la résidence permanente"],d:["482는 임시 비자라서 기간이 끝나면 만료돼요. 영주권(계속 살 수 있는 권리)은 그다음 단계인 186 비자로 신청해요. 482를 받았다고 영주권이 자동으로 나오는 건 아니에요.", "Le 482 est temporaire. La résidence permanente (droit de rester durablement) se demande ensuite avec le visa 186. Avoir un 482 ne garantit pas la résidence permanente."]},
{t:["내 직업 코드 (ANZSCO)","Code de mon métier (ANZSCO)"],d:["호주는 모든 직업에 번호를 붙여 놔요. 이 번호가 ANZSCO 코드예요. 고용주가 비자 서류에 내 직업 번호를 적는데, 용접공은 322313이에요. 둘 다 호주 정부의 기술직 목록(CSOL)에 있고, 기술평가(내 실력 심사)는 TRA라는 기관이 해요.", "L'Australie attribue un numéro à chaque métier : c'est le code ANZSCO. L'employeur l'inscrit dans le dossier ; pour un soudeur, c'est 322313. Les deux codes figurent sur la liste CSOL (métiers qualifiés) et l'évaluation des compétences est faite par un organisme appelé TRA."],stats:[[["322313","322313"],["용접공 Welder (First Class)","Soudeur de première classe (Welder First Class)"]],[["322312","322312"],["압력용접공 Pressure Welder","Soudeur haute pression (Pressure Welder)"]]]},
{t:["내 직업이 목록에 있나요?","Mon métier est-il sur la liste ?"],d:["비자는 정부가 정한 ‘인력이 필요한 직업 목록’(CSOL)에 있는 직업만 받을 수 있어요. 용접공(322313)과 압력용접공(322312)은 이 목록에 있어요. 목록은 바뀔 수 있으니 접수하기 전에 공식 목록에서 다시 확인하세요.", "Seuls les métiers de la liste officielle des métiers recherchés (CSOL) ouvrent droit au visa. Soudeur (322313) et soudeur haute pression (322312) y figurent. La liste change : revérifiez-la avant de déposer."],k:'csol'},
{t:["SBS란? (승인된 스폰서)","Qu'est-ce que le SBS ? (sponsor agréé)"],d:["SBS는 ‘외국인 직원을 스폰서해도 된다고 정부가 허락한 회사’라는 뜻이에요. 스폰서 자격증 같은 거예요. 회사가 아직 없다면 회사(고용주)가 먼저 신청해서 승인받아야 해요. 내가 대신 할 수 없어요.", "SBS : entreprise que le gouvernement a autorisée à sponsoriser des travailleurs étrangers, comme un « agrément ». Si elle ne l'a pas encore, c'est à l'employeur de le demander d'abord ; vous ne pouvez pas le faire à sa place."]},
{t:["스폰서 고용주","Employeur sponsor"],d:["모든 일의 출발점이에요. SBS 승인을 받은 회사가 ‘이 직원을 이 자리에 쓰겠다’고 정부에 공식 요청(노미네이션)을 해 줘야 해요. 이 요청이 없으면 내 비자 신청은 시작할 수 없어요.", "C'est le point de départ de tout. Une entreprise agréée SBS doit déposer officiellement une demande (« nomination ») pour votre poste. Sans elle, vous ne pouvez pas déposer votre visa."],k:'sponsor'},
{t:["LMT란? (구인 광고)","Qu'est-ce que le LMT ? (annonce)"],d:["LMT는 ‘호주 사람부터 먼저 구해 봤는데 못 구했다’는 걸 보여 주는 절차예요. 회사가 구인 광고를 올리고, 최소 4주(28일) 동안 내려가지 않게 해야 해요. 광고가 4주 지나야 다음 단계로 갈 수 있어서 가장 먼저 시작해야 해요. 예외가 있을 수 있으니 확인하세요.", "LMT : preuve que l'entreprise a d'abord cherché à recruter en Australie. Elle publie une annonce qui doit rester en ligne au moins 4 semaines (28 jours). Il faut donc la lancer en premier. Des exceptions existent : à vérifier."]},
{t:["AMSR란? (시장 임금)","Qu'est-ce que l'AMSR ? (salaire du marché)"],d:["같은 지역에서 같은 일을 하는 호주 직원이 보통 받는 연봉이에요. 외국인이라고 이보다 적게 줄 수 없다는 규칙이에요. 그래서 내 연봉은 이 금액 이상이어야 해요. 금액은 고용주나 이민법무사(MARA)에게 물어보세요.", "Salaire annuel que reçoit habituellement un employé australien pour le même poste dans la même région. Un étranger ne peut pas être payé moins. Votre salaire doit donc être au moins égal à ce montant ; demandez-le à l'employeur ou à un agent MARA."]},
{t:["연봉 기준","Seuil de salaire"],d:["조건이 두 가지예요. ① 기본급이 AUD 79,499 이상 ② 시장 임금(AMSR)보다 적지 않을 것. 기본급은 일반 시급 기준 연봉이고, 초과근무 수당은 계산에 넣지 않아요. 기준 금액은 해마다 바뀌니 접수 전에 확인하세요.", "Deux conditions : ① salaire de base d'au moins 79 499 AUD ② pas inférieur à l'AMSR. Le salaire de base exclut les heures supplémentaires. Le seuil change chaque année : vérifiez avant de déposer."],k:'salC'},
{t:["경력 1년 이상","Au moins 1 an d'expérience"],d:["최근 5년 안에 이 직업(용접)으로 풀타임 1년 이상 일한 기록이 필요해요. 풀타임은 주 38시간으로 계산해요. 주 60시간 일했어도 38시간까지만 인정돼요. 회사 증명서와 급여명세서가 증거가 돼요.", "Il faut au moins 1 an à temps plein dans ce métier (soudure) sur les 5 dernières années, compté sur 38 h par semaine : même à 60 h, seules 38 h comptent. Attestation de l'employeur et fiches de paie servent de preuves."],k:'exp1'},
{t:["영어 점수","Niveau d'anglais"],d:["호주는 기본 영어 실력을 증명하라고 해요. PTE 시험은 4개 영역(말하기·쓰기·읽기·듣기) 각각 36점 이상, IELTS는 각 영역 5.0 이상이에요. 한 영역이라도 모자라면 안 돼요. 공부 방법은 Step 2에 있어요.", "L'Australie demande une preuve d'anglais de base : au PTE, 36 minimum dans chacune des 4 compétences (oral, écriture, lecture, écoute) ; à l'IELTS, 5,0 minimum chacune. Une seule compétence insuffisante suffit à échouer. La méthode est à l'étape 2."],k:'eng5'},
{t:["서류 준비","Documents"],d:["크게 세 종류예요. 건강검진, 범죄경력증명서(‘범죄 기록 없음’ 증명), 그리고 벨기에 서류의 영어 번역본이에요. 번역은 반드시 호주의 NAATI 공인 번역사에게 맡기세요. 자세한 목록은 Step 3에 있어요.", "Trois grandes catégories : visite médicale, casier judiciaire (preuve de l'absence de condamnation) et traduction anglaise des documents belges. La traduction doit être faite par un traducteur australien certifié NAATI. La liste détaillée est à l'étape 3."],k:'docs'},
{t:["벨기에 서류 체크리스트","Check-list des documents belges"],d:["하나씩 챙기세요. 정확한 필수 서류는 접수할 때 Home Affairs 안내로 최종 확인하세요.","Rassemblez-les un par un. Vérifiez la liste exacte dans les instructions du Home Affairs au moment du dépôt."],pre:'b',check:[
["유효한 벨기에 여권 (사진 페이지 사본)","Passeport belge valide (copie de la page photo)"],
["벨기에 범죄경력증명서 (Extrait de casier judiciaire) — 벨기에에서 12개월 이상 살았다면 필요해요. 벨기에 법무부(FPS Justice) 중앙 범죄기록소에 신청해요.","Extrait de casier judiciaire belge — requis si vous avez vécu 12 mois ou plus en Belgique. À demander au Casier judiciaire central du SPF Justice."],
["호주 경찰 신원조회(AFP National Police Check) — 호주에서 12개월 이상 살았다면 필요해요.","Police check australien (AFP National Police Check) — requis si vous avez vécu 12 mois ou plus en Australie."],
["용접 자격증·졸업장 (원본 + 영문 번역)","Diplômes et certificats de soudage (original + traduction anglaise)"],
["벨기에 고용주의 경력 증명서·급여명세서","Attestations d'emploi et fiches de paie des employeurs belges"],
["가족과 함께 신청한다면 결혼증명서·자녀 출생증명서","Si la famille vous accompagne : acte de mariage et actes de naissance des enfants"],
["영어가 아닌 서류는 모두 NAATI 영문 번역본 + 원본","Tout document non anglais : traduction NAATI + original"]
]},
{t:["비자 만료 8주 전이라면","Visa expirant dans 8 semaines"],d:["시간이 부족해도 방법이 있어요. 고용주가 지금 구인 광고(최소 4주)를 시작하고, 내 비자가 끝나기 전에 482를 접수하면 브리징 비자(BVA)가 자동으로 적용돼요. BVA는 ‘심사 결과가 나올 때까지 합법적으로 머물며 일할 수 있게 해 주는 임시 비자’예요. 단, 접수는 반드시 지금 비자가 끝나기 전에 해야 해요.", "Même avec peu de temps, il y a une solution : l'employeur lance l'annonce (4 semaines minimum) maintenant et vous déposez le 482 avant l'expiration de votre visa actuel ; le Bridging Visa (BVA) prend alors le relais. Le BVA vous laisse séjourner et travailler légalement pendant l'examen. Le dépôt doit se faire avant l'expiration."]},
{t:["60일 타임라인 (직접 움직여 보세요)","Calendrier de 60 jours (faites glisser)"],d:["슬라이더를 오늘(Day 0)부터 비자 만료(Day 60)까지 움직이면, 그날 무슨 일이 일어나는지 보여줘요. 당황하지 않도록 미리 확인하세요.","Faites glisser du jour 0 au jour 60 : voyez ce qui se passe à chaque étape pour ne pas paniquer."],scrub:1},
{t:["보스에게 말하기","Parler à son patron"],d:["스폰서 승인, 구인 광고 즉시 시작, 기본급 AUD 79,499 이상 — 이 3가지만 부탁하세요.","Demandez 3 choses : agrément sponsor, annonce tout de suite, salaire de base d'au moins 79 499 AUD."],c:MAIL},
{t:["누가 비용을 내나요?","Qui paie quoi ?"],d:["고용주가 내는 돈: 스폰서 신청비, 노미네이션 비용, SAF 세금(기술 인력 교육 기금). 내가 내는 돈: 비자 신청비(약 AUD 3,115부터), 영어 시험, 건강검진, 번역, 건강보험. 금액은 바뀔 수 있어요.", "L'employeur paie : agrément sponsor, nomination et taxe SAF (fonds de formation). Vous payez : frais de visa (environ 3 115 AUD et plus), test d'anglais, visite médicale, traductions et assurance santé. Les montants peuvent changer."]},
{t:["영주권 로드맵","Feuille de route vers la RP"],d:["482로 같은 회사에서 2년 일하면 186 비자(TRT 방식)로 영주권을 신청할 수 있어요. 기술평가를 받고 경력이 3년 이상이면 Direct Entry(바로 신청)라는 다른 길도 있어요. 어느 쪽이 맞는지는 이민법무사와 상의하세요.", "Après 2 ans chez le même employeur avec le 482, vous pouvez demander la résidence permanente avec le visa 186 (volet TRT). Avec une évaluation des compétences et 3 ans d'expérience, il existe aussi la voie Direct Entry. Un agent MARA vous dira laquelle convient."]},
{t:["자주 나오는 용어","Mini-glossaire"],d:["SBS = 스폰서 승인 회사 · CSOL = 인력이 필요한 직업 목록 · AMSR = 같은 일의 시장 연봉 · LMT = 호주인 우선 구인 광고 · BVA = 심사 중 임시 체류 비자 · MARA = 공인 이민법무사.", "SBS = entreprise agréée sponsor · CSOL = liste des métiers recherchés · AMSR = salaire du marché · LMT = annonce de recrutement préalable · BVA = visa transitoire pendant l'examen · MARA = agent d'immigration agréé."]},
{t:["자주 묻는 질문","Questions fréquentes"],d:["눌러서 열어 보세요.","Touchez pour ouvrir."],faq:[
[["브리징 비자는 어떻게 작동하나요?","Comment fonctionne le visa de transition ?"],["현재 비자가 끝나기 전에 482를 접수하면, 만료일부터 Bridging Visa A가 시작돼요. 기존과 같은 근무 권리로 심사 결과를 기다릴 수 있어요. 접수가 늦으면 적용되지 않으니, 지금 비자로 호주 안에서 신청할 수 있는지 이민법무사(MARA)에게 꼭 확인하세요.","Si vous déposez le 482 avant la fin de votre visa, le Bridging Visa A démarre à l'expiration, avec les mêmes droits de travail. Un dépôt tardif ne l'active pas : confirmez auprès d'un agent MARA que votre visa permet la demande depuis l'Australie."]],
[["사장님께 어떻게 말하나요?","Comment en parler au patron ?"],["짧게, 회사 입장에서 말하세요. ① SBS 승인 확인 ② 구인 광고(LMT) 이번 주 시작 ③ 용접공(322313)·기본급 AUD 79,499 이상. 비자 신청비·검진·영어 시험은 내가 내고, 스폰서·노미네이션·SAF는 회사가 내요.","Restez bref et parlez business : ① confirmer l'agrément SBS ② lancer l'annonce LMT cette semaine ③ soudeur (322313), salaire de base d'au moins 79 499 AUD. Visa, visite et test sont à votre charge ; sponsor, nomination et SAF à celle de l'entreprise."]],
[["직업 코드와 영어 기준은?","Code métier et anglais ?"],["용접공은 ANZSCO 322313(압력용접공은 322312)이에요. 영어는 PTE 각 영역 36점 또는 IELTS 5.0 이상이고, 경력은 최근 5년 안에 풀타임 1년 이상(주 38시간 기준)이 필요해요.","Soudeur : ANZSCO 322313 (soudeur haute pression : 322312). Anglais : PTE 36 par compétence ou IELTS 5,0 ; expérience : 1 an à temps plein sur les 5 dernières années (base 38 h/semaine)."]]]},
{t:["꼭 기억하세요","À retenir"],d:["일반 정보이며 이민 법률 자문이 아니에요. 금액과 기준은 해마다 바뀌니 Home Affairs나 이민 대리인(MARA)에게 확인하세요.","Informations générales, pas un conseil juridique. Les montants changent chaque année : vérifiez auprès du Home Affairs ou d'un agent MARA."]},
{t:["최종 체크리스트","Check-list finale"],d:["하나씩 눌러서 확인하세요. 모두 체크하면 접수 준비 끝이에요.","Cochez chaque point. Quand tout est coché, le dossier est prêt à être déposé."],pre:'v',check:[

["구인 광고(LMT)를 올렸고 최소 4주 게시해요","L'annonce (LMT) est publiée, au moins 4 semaines"],
["고용주가 내 자리를 노미네이션했어요","L'employeur a déposé la nomination de mon poste"],
["계약서 기본급이 AUD 79,499 이상이고 시장 임금(AMSR) 이상이에요","Le salaire de base du contrat est d'au moins 79 499 AUD et au moins égal à l'AMSR"],
["서류의 직업 코드(322313 / 322312)가 실제 하는 일과 맞아요","Le code métier du dossier (322313 / 322312) correspond à mon travail réel"],
["기술평가(TRA)가 필요한지 확인했고, 필요하면 받았어요","J'ai vérifié si l'évaluation TRA est requise et, si oui, je l'ai obtenue"],
["최근 5년 안에 풀타임 1년 이상 경력 증빙을 모았어요","J'ai réuni les preuves d'au moins 1 an à temps plein sur les 5 dernières années"],
["영어 점수(PTE 각 36점 또는 IELTS 5.0)를 받았거나 시험을 예약했어요","Score d'anglais obtenu (PTE 36 ou IELTS 5,0) ou test réservé"],
["건강검진과 범죄경력증명서를 준비했어요","Visite médicale et extrait de casier judiciaire prêts"],

]}

const D2=[
{tags:P1,t:["PTE 시험 한눈에 보기","Le PTE en un coup d'œil"],d:["컴퓨터로 한 번에 보고, 사람 면접관은 없어요. 점수는 10~90점이고 목표는 모든 영역 각 36점 이상이에요.","Test sur ordinateur, sans examinateur humain. Score de 10 à 90 : l'objectif est 36 minimum dans chaque compétence."],stats:[[["약 2시간","Environ 2 h"],["한 번에 응시","Une seule session"]],[["10~90점","10 à 90 pts"],["목표: 각 36점+","Objectif : 36+ chacun"]],[["순서","Ordre"],["Speaking·Writing 54~67분 → Reading 29~30분 → Listening 30~43분","Oral·Écriture 54-67 min → Lecture 29-30 min → Écoute 30-43 min"]]],k:'eng5'},
{tags:P1,t:["원리 ① 침묵 금지 (3초 규칙)","Principe ① Jamais de silence (règle des 3 s)"],d:["말하기에서 3초 이상 멈추면 마이크가 자동으로 꺼져요. 틀려도 멈추지 말고 계속 말하세요.","À l'oral, le micro se coupe après 3 secondes de silence. Même en vous trompant, continuez à parler."]},
{tags:P1,t:["원리 ② 유창성과 발음이 먼저","Principe ② Fluidité et prononciation d'abord"],d:["어려운 단어나 완벽한 문법이 없어도, 일정한 속도로 또박또박 끊김 없이 말하면 AI가 높게 채점해요.","Sans mots difficiles ni grammaire parfaite, parler à vitesse régulière, distinctement et sans coupure donne un bon score IA."]},
{tags:P1,t:["원리 ③ 점수 공유 (Cross-scoring)","Principe ③ Scores partagés (cross-scoring)"],d:["말하기 일부 문제가 읽기·듣기 점수에도 반영돼요. 그래서 말하기 연습이 전체 점수를 같이 올려요.","Certaines tâches orales comptent aussi pour la lecture et l'écoute : s'entraîner à l'oral fait monter tout le score."]},
{tags:P2,t:["1. Speaking 말하기","1. Speaking (oral)"],d:["가장 중요해요. 다른 영역 점수까지 끌어올려요.","La compétence la plus importante : elle tire aussi les autres scores."],rows:[
 [["① Read Aloud (지문 읽기)","① Read Aloud (lecture à voix haute)"],["모르는 단어도 비슷하게 발음하며 멈추지 말고 읽어요.","Mot inconnu ? Prononcez-le approximativement et continuez sans vous arrêter."]],
 [["② Repeat Sentence (문장 따라 말하기)","② Repeat Sentence (répéter la phrase)"],["다 못 외워도 기억나는 핵심 단어 50% 이상을 유창하게 말해요.","Même sans tout retenir, dites couramment au moins 50 % des mots clés retenus."]],
 [["③ Describe Image (그림 묘사)","③ Describe Image (décrire une image)"],["분석하지 말고 만능 틀에 제목과 숫자만 끼워 말해요.","N'analysez pas : insérez titre et chiffres dans un modèle appris."]],
 [["④ Retell Lecture / Answer Short Question","④ Retell Lecture / Answer Short Question"],["들린 단어 3~4개를 만능 틀에 끼워 말해요.","Insérez 3-4 mots entendus dans un modèle."]]],tpl:TPL1,tplT:["초간단 실전 템플릿 보기 (Describe Image)","Voir le modèle express (Describe Image)"]},
{tags:P2,t:["2. Writing 쓰기","2. Writing (écriture)"],d:["만능 틀과 받아쓰기로 해결해요.","Un modèle de base et la dictée font l'essentiel."],rows:[
 [["① Summarize Written Text (한 문장 요약)","① Summarize Written Text (résumé en une phrase)"],["중요한 두 문장을 가져와 , and 또는 , which로 이어 한 문장(5~75단어)으로 써요.","Prenez 2 phrases clés et reliez-les par « , and » ou « , which » : une phrase de 5 à 75 mots."]],
 [["② Write Essay (에세이)","② Write Essay (dissertation)"],["20분, 200~300단어. 외운 틀의 빈칸에 문제 키워드만 채워요.","20 min, 200-300 mots. Remplissez les blancs du modèle avec les mots clés du sujet."]]],tpl:TPL2,tplT:["초간단 실전 템플릿 보기 (Essay)","Voir le modèle express (Essay)"]},
{tags:P2,t:["3. Reading 읽기","3. Reading (lecture)"],d:["시간 배분과 기초 어휘가 핵심이에요.","Gestion du temps et vocabulaire de base."],rows:[
 [["① Fill in the Blanks (빈칸 채우기)","① Fill in the Blanks (texte à trous)"],["문법을 다 따지지 말고 앞뒤 단어와의 자연스러운 짝(collocation)으로 빠르게 골라요.","N'analysez pas toute la grammaire : choisissez vite d'après les associations naturelles (collocations)."]],
 [["② Multiple Choice / Re-order Paragraphs","② Multiple Choice / Re-order Paragraphs"],["객관식은 30초 안에 고르고 넘어가서 빈칸 문제에 시간을 써요.","Répondez aux QCM en 30 s max et gardez le temps pour les textes à trous."]]]},
{tags:P2,t:["4. Listening 듣기","4. Listening (écoute)"],d:["마지막 결정타는 받아쓰기예요.","Le coup de grâce : la dictée."],rows:[
 [["① Write From Dictation (받아쓰기)","① Write From Dictation (dictée)"],["APEUni 빈출 문장 100선을 외우고, 철자가 헷갈리면 아는 대로 최대한 적어요.","Apprenez les 100 phrases fréquentes d'APEUni ; en cas de doute sur l'orthographe, écrivez le plus possible."]],
 [["② Summarize Spoken Text / Fill in the Blanks","② Summarize Spoken Text / Fill in the Blanks"],["들리는 핵심 명사 4~5개를 메모해 요약 틀에 끼워 넣어요.","Notez 4-5 noms clés entendus et insérez-les dans le modèle de résumé."]]]},
{t:["템플릿은 뼈대로만","Le modèle n'est qu'un squelette"],d:["Pearson은 통째로 외운 답안의 점수를 낮출 수 있다고 해요. 틀의 [ ]에 직접 내용을 채우고, 문장도 조금씩 바꿔 연습하세요.","Pearson peut pénaliser les réponses entièrement mémorisées. Remplissez vous-même les [ ] et variez un peu les phrases à l'entraînement."]},
{t:["준비물","À préparer"],d:["유효한 벨기에 여권, Pearson 계정·예약 확인증, 연습 앱 APEUni(비공식 AI 채점)예요.","Passeport belge valide, compte Pearson + confirmation de réservation, appli APEUni (notation IA non officielle)."]},
{t:["APEUni 사이트 (연습)","APEUni (entraînement)"],d:["PTE 연습용 사이트·앱이에요. AI 채점으로 말하기·쓰기를 미리 점수 확인하고, 빈출 문제와 모의고사를 풀 수 있어요. 공식 사이트가 아니라서 점수는 참고용이에요. 가입 후 무료 모의고사 1회부터 해 보세요.","Site et appli d'entraînement au PTE : notation IA de l'oral et de l'écrit, questions fréquentes et tests blancs. Non officiel : les scores sont indicatifs. Après inscription, commencez par le test blanc gratuit."],links:[["https://www.apeuni.com","apeuni.com"]]},
{t:["Pearson 사이트 (공식 예약)","Pearson (réservation officielle)"],d:["PTE를 주관하는 공식 사이트예요. 1) 계정 만들기 (이름은 여권과 똑같이) → 2) 시험장·날짜 선택 → 3) 요금 결제 → 4) 예약 확인 메일 저장 순서예요. 시험 당일에는 예약 확인증과 여권을 가져가세요.","Site officiel de l'organisateur du PTE. 1) Créez un compte (nom identique au passeport) → 2) choisissez centre et date → 3) payez → 4) conservez l'e-mail de confirmation. Le jour J : confirmation + passeport."],links:[["https://www.pearsonpte.com","pearsonpte.com"]]},
{t:["시험 예약","Réserver le test"],d:["멜버른 시티(CBD) 시험장을 추천해요. 결과는 응시 후 2~5일 안에 나와요.","Centre de Melbourne CBD recommandé. Résultats 2 à 5 jours après le test."],link:"https://www.pearsonpte.com"},
{t:["14일 체크리스트","Check-list de 14 jours"],d:["매일 20분. 항목을 누르면 진행 바가 올라가요.","20 minutes par jour. Cochez : la barre avance."],list:1}
];

const D3=[
{t:["서류 마스터 체크리스트","Check-list des documents"],d:["서류를 하나 모을 때마다 칸을 눌러요. 위의 퍼센트가 올라가요. 칸이 다 차면 이민법무사에게 보낼 준비가 끝난 거예요.","Cochez chaque document réuni : le pourcentage monte. Quand tout est coché, vous pouvez tout envoyer à l'agent."],master:1},
{t:["스캔과 NAATI 번역 쉬운 팁","Scan et traduction NAATI : conseils simples"],d:["서류가 거절되는 이유는 대부분 흐린 스캔과 잘못된 번역이에요. 아래 순서대로 하세요.","La plupart des refus viennent d'un scan flou ou d'une mauvaise traduction. Suivez l'ordre ci-dessous."],rows:[
 [["1. 스캔 앱 쓰기","1. Utiliser une appli de scan"],["카메라로 그냥 찍지 말고 Adobe Scan 같은 앱을 써요. 컬러로, 서류 네 모서리가 다 보이게, 밝은 곳에서 찍어요.","Ne prenez pas une simple photo : utilisez Adobe Scan ou similaire. En couleur, les quatre coins visibles, dans un endroit bien éclairé."]],
 [["2. 확대해서 확인","2. Zoomer pour vérifier"],["스캔한 뒤 화면을 확대해 글자·도장·서명이 또렷한지 봐요. 흐리면 다시 찍어요.","Zoomez sur le scan : texte, tampons et signatures doivent être nets. Sinon, recommencez."]],
 [["3. 한 서류 = 한 PDF","3. Un document = un PDF"],["여러 장짜리 서류는 페이지 순서대로 한 파일로 묶어요. 파일 이름은 ‘Passport.pdf’처럼 무엇인지 알 수 있게 영어로 써요.","Un document de plusieurs pages = un seul PDF, pages dans l'ordre. Nommez-le clairement en anglais, par ex. « Passport.pdf »."]],
 [["4. 번역은 호주에서","4. Traduction en Australie"],["벨기에에서 한 번역이나 공증은 인정되지 않을 수 있어요. 호주에 있는 NAATI 공인 번역사를 찾아 스캔본을 이메일로 보내요.","Une traduction ou légalisation faite en Belgique peut être refusée. Trouvez un traducteur NAATI en Australie et envoyez-lui vos scans par e-mail."]],
 [["5. 보내기 전에 물어보기","5. Poser les questions avant"],["번역 비용, 걸리는 기간, 받을 파일 형식(도장 찍힌 PDF)을 먼저 물어봐요. 서류가 여러 개면 한 번에 보내요.","Demandez d'abord le prix, le délai et le format reçu (PDF tamponné). Envoyez tous les documents en une fois."]],
 [["6. 받은 뒤 확인","6. Vérifier à la réception"],["번역본의 이름·날짜·직책이 원본과 똑같은지 확인해요. 철자가 다르면 바로 고쳐 달라고 하세요. 원본 스캔과 번역본은 한 쌍으로 보관해요.","Vérifiez que nom, dates et fonction correspondent à l'original. Faites corriger toute erreur. Gardez scan et traduction ensemble, par paire."]]]},
{t:["이민성 어카운트(ImmiAccount) 만들기","Créer son ImmiAccount (Home Affairs)"],d:["ImmiAccount는 호주 이민성(Home Affairs)의 공식 온라인 계정이에요. 무료이고, 비자 접수·진행 상황 확인·결제를 모두 여기서 해요. 이민법무사가 접수해 주더라도 내 계정이 있으면 진행 상황을 직접 볼 수 있어요.","L'ImmiAccount est le compte en ligne officiel du Home Affairs. Gratuit : dépôt du visa, suivi du dossier et paiement s'y font. Même si un agent dépose pour vous, votre propre compte permet de suivre le dossier."],steps:[
 ["1",["아래 버튼으로 이민성 로그인 페이지에 들어가 ‘Create ImmiAccount’를 눌러요.","Ouvrez la page de connexion ci-dessous et cliquez sur « Create ImmiAccount »."]],
 ["2",["계정 종류는 ‘Individual(개인)’을 선택해요. Organisation은 회사용이라 내가 만들 필요 없어요.","Choisissez le type « Individual ». « Organisation » est réservé aux entreprises."]],
 ["3",["이름·생년월일은 여권과 똑같이, 이메일은 계속 쓸 주소로 입력해요.","Nom et date de naissance identiques au passeport ; e-mail que vous gardez durablement."]],
 ["4",["비밀번호와 보안 질문을 설정하고 제출해요. 로그인 정보는 따로 안전하게 저장하세요.","Définissez mot de passe et questions de sécurité, puis validez. Conservez ces identifiants en lieu sûr."]],
 ["5",["가입 후 이메일·로그인 확인이 끝나면 완료예요. 이민법무사에게 계정 이메일을 알려 주세요.","Une fois l'e-mail confirmé et la connexion testée, c'est terminé. Communiquez l'adresse à votre agent."]]
],links:[["https://online.immi.gov.au/lusc/login","ImmiAccount 로그인·가입 / Connexion et création"],["https://immi.homeaffairs.gov.au/help-support/applying-online-or-on-paper/online/create-your-immiaccount","공식 가입 안내 / Guide officiel de création"]]},
{t:["접수 직후 타임라인 (BVA)","Après le dépôt : chronologie (BVA)"],d:["접수는 반드시 기존 비자가 끝나기 전에 하세요.","Déposez toujours avant l'expiration du visa actuel."],steps:[
 ["3-1",["이민법무사에게 모든 서류와 PTE 성적표를 전달하면, 노미네이션과 482 비자를 함께 온라인으로 접수해요.","Transmettez tous les documents et le score PTE à l'agent d'immigration : la nomination et le visa 482 sont déposés en ligne ensemble."]],
 ["3-2",["기존 비자가 끝나기 전에 접수하면 Bridging Visa A(BVA)가 적용돼요. 합법적으로 체류하고 AMA Precast에서 풀타임 근무를 이어갈 수 있어요.","Si le dépôt est fait avant l'expiration du visa actuel, le Bridging Visa A (BVA) prend le relais : séjour légal et travail à temps plein chez AMA Precast maintenus."]],
 ["3-3",["482 최종 승인 후 2년 근무하면 186 영주권(TRT 스트림) 신청 자격이 생겨요.","Après l'approbation du 482 et 2 ans de travail : éligibilité au visa 186 de résidence permanente (volet TRT)."]]]}
];

const REQ={t:["필요한 점수","Score requis"],d:["482 비자의 영어 기준은 PTE 모든 영역 각 36점 이상이에요. 한 영역이라도 모자라면 안 돼요. 영주권(186) 쪽은 더 높은 점수(보통 PTE 50 / IELTS 6.0)를 요구할 수 있으니 접수 전에 확인하세요.","Pour le 482 : 36 minimum dans chaque compétence du PTE, aucune ne peut manquer. Pour le visa 186, un score plus élevé (souvent PTE 50 / IELTS 6,0) peut être exigé : vérifiez avant de déposer."],stats:[[["각 36점+","36+ chacun"],["PTE 4개 영역 모두","Les 4 compétences PTE"]],[["IELTS 5.0","IELTS 5,0"],["대신 낼 수 있어요","Alternative possible"]],[["면제","Dispense"],["면제국 여권이면 시험 불필요","Aucun test pour un passeport dispensé"]]],k:'eng5'};

{t:["Repeat Sentence (문장 따라 말하기)","Repeat Sentence (répéter la phrase)"],d:["들은 문장을 그대로 따라 말해요.","Répétez la phrase entendue."],rows:[[["핵심 단어 우선","Mots clés d'abord"],["다 못 외워도 기억나는 단어 50% 이상을 유창하게 말해요.","Même sans tout retenir, dites couramment au moins 50 % des mots."]],[["순서 지키기","Garder l'ordre"],["들은 순서대로, 끝까지 멈추지 말고 말해요.","Dans l'ordre entendu, sans s'arrêter."]]]},

<script>

[0,["Day 0 · 오늘","Jour 0 · Aujourd'hui"],["사장님께 요청해요","Demandez au patron"],["스폰서 승인 확인, 구인 광고 이번 주 시작, 직업 코드 지정을 부탁하세요. 광고는 최소 4주 올라가야 해요.","Sponsor confirmé, annonce lancée cette semaine, code métier fixé. L'annonce doit rester 4 semaines minimum."]],

[30,["Day 30 · 노미네이션","Jour 30 · Nomination"],["회사가 노미네이션, 나는 접수","Nomination et dépôt"],["회사가 내 자리를 노미네이션하고, 이민법무사가 내 482를 접수해요. 계속 일할 수 있어요.","L'entreprise nomine votre poste et l'agent dépose votre 482. Vous continuez à travailler."]],
[45,["Day 45~59 · 대기","Jours 45-59 · Attente"],["평소처럼 일해요","Travaillez normalement"],["심사 중이에요. 이민성에서 추가 요청이 오면 빠르게 답하세요.","Dossier en cours d'examen. Répondez vite à toute demande du Home Affairs."]],

let prevPb=null,pk=null,lastTick=null;
